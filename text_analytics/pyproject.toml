[project]
name = "text-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "khemingkapat", email = "60930364+khemingkapat@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "nltk>=3.10.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.15",
    "wordcloud>=1.9.6",
]

[project.scripts]
text-analytics = "text_analytics:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "jupyterlab-vim>=4.1.4",
]
